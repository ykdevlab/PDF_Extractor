<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Extractor</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="hero"><div class="brand-art"><img src="icons/brand-logo.png" alt="PDF Extractor logo"></div><div class="brand-copy"><div class="eyebrow"><span class="live-dot"></span> READY TO EXTRACT</div><h1>PDF Extractor</h1><p>Find it. Open it. Save it.</p></div></header>
<section class="summary"><div class="summary-copy"><span class="summary-label">YOUR LIBRARY</span><strong id="count">0 documents</strong></div><div class="toolbar"><button id="refresh" class="icon-button" title="Refresh list" aria-label="Refresh list"><span aria-hidden="true">↻</span> Refresh</button><button id="clear" class="icon-button subtle" title="Clear detected documents">Clear</button></div></section>
<div id="status" class="status"><span class="status-dot"></span><span id="diagnostic">Checking status…</span></div>
<main id="list" aria-live="polite"></main>
<div id="empty" class="empty"><div class="empty-graphic"><span>PDF</span><span class="down-arrow">↓</span></div><strong>No PDFs yet</strong><p>Open a document on the supported e-learning website. Your detected PDFs will appear here.</p><button id="emptyRefresh" class="primary-button">Check again <span>↗</span></button></div>
<footer><div class="footer-note"><span class="shield">✓</span><span>Stored locally on your device</span></div><a class="support-link" href="https://buymeatea.online/ykdevlab" target="_blank" rel="noopener noreferrer"><span>☕</span> Support YKDevLab</a></footer>
<script src="popup.js"></script></body></html>
